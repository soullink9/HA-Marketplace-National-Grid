# Publishes GitHub's releases: nationalgrid.zip and its SHA256SUMS, with release notes taken from that version's section of
# CHANGELOG.md. This is the copy the Marketplace installs and updates from.
# (.gitea/workflows/release.yml publishes them on Gitea first; both use the scripts in scripts/.)
#
# GitHub ends up with the same releases as Gitea: the same files, title and notes. Releases start on Gitea, and
# Gitea's push mirror brings their tags here (every 8 hours). Every push from the mirror starts this workflow:
#   1. plan: lists the version tags with no published release here yet (scripts/plan_github_releases.py).
#      Checking every tag, not only the one pushed, matters: when more than three tags arrive in one push GitHub
#      starts no workflow for any of them, and a release whose run failed gets another go at the next push.
#   2. check: for each of them, oldest first, checks out the tag, runs every check and builds the same files Gitea
#      built (the builds are repeatable, byte for byte). This job can't write anything: it installs ruff from PyPI,
#      and runs on a read-only token that its checkout doesn't keep.
#   3. release: for each version whose checks passed, builds the files again from the tag (the repository's own
#      scripts only, nothing installed), makes sure they're the bytes the check built (same SHA256SUMS), and
#      publishes them with the same title and notes. Only this job may write to the repository.
# Actions tab → Release → Run workflow does the same straight away, without waiting for the mirror.
# It never creates a tag: the mirror deletes tags Gitea doesn't have, so a tag made here wouldn't last.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:

# Nothing by default: each job asks for what it needs, and only the release job may write.
permissions: {}

# One run at a time: a mirror push that moves main and brings a tag starts this twice, and the second run then
# finds the release already published instead of racing the first to create it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to list the releases
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to compare with GitHub's releases
          persist-credentials: false

      - name: Find the version tags GitHub has no release for
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,isDraft > releases.json
          python3 scripts/plan_github_releases.py releases.json "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    name: Check ${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1 # one at a time, oldest version first
      fail-fast: false # a version that fails its checks doesn't hold up the others
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.tag }} # the release is built from its tag, as on Gitea
          persist-credentials: false

      # Home Assistant 2026.11 runs on Python 3.14 and supports nothing older, so that's what the tests run on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check the version and the release notes in CHANGELOG.md
        env:
          TAG: ${{ matrix.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$GITHUB_REPOSITORY" notes.md

      - name: Install what the checks need
        run: pip install ruff

      - name: Lint and format (ruff)
        run: ruff check && ruff format --check

      - name: Run every test
        run: |
          python3 tests/test_integration.py
          if [ -f tests/test_bad_data.py ]; then python3 tests/test_bad_data.py; fi  # (not in tags before v1.3.1)
          python3 tests/test_release.py

      - name: Build nationalgrid.zip and SHA256SUMS, and check the zip installs as custom_components/nationalgrid/
        run: |
          python3 scripts/build_package.py
          [ -f dist/SHA256SUMS ] || (cd dist && sha256sum -- * > SHA256SUMS)  # (built by tags from v1.3.1 on)

      # What the release job checks its own build against: proof this version passed, and of what it built
      - uses: actions/upload-artifact@v7
        with:
          name: checked-${{ matrix.tag }}
          path: dist/SHA256SUMS
          retention-days: 1

  release:
    needs: [plan, check]
    # Runs even when some version failed its checks, so the others still publish; each version still needs its own
    # check to have passed (its checked-<tag> file, below).
    if: ${{ !cancelled() && needs.plan.outputs.releases != '[]' }}
    name: Release ${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases
    strategy:
      max-parallel: 1 # one at a time, oldest version first
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - name: Get what this version's check built (missing if the check failed)
        uses: actions/download-artifact@v8
        with:
          name: checked-${{ matrix.tag }}
          path: checked

      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.tag }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Take the release notes from CHANGELOG.md
        id: notes
        working-directory: source
        env:
          TAG: ${{ matrix.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$GITHUB_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      # The asset keeps the same name in every release: .../releases/latest/download/nationalgrid.zip relies on it.
      - name: Build nationalgrid.zip and SHA256SUMS, and make sure they're what the check built
        working-directory: source
        run: |
          python3 scripts/build_package.py
          [ -f dist/SHA256SUMS ] || (cd dist && sha256sum -- * > SHA256SUMS)  # (built by tags from v1.3.1 on)
          cmp dist/SHA256SUMS ../checked/SHA256SUMS

      - name: Publish
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          LATEST: ${{ matrix.latest }}
        run: |
          # A draft on this tag is what GitHub leaves when a tag goes missing from Gitea for a while: replace it.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # "Latest" only for the newest version without a suffix, so publishing an older version after a newer one
          # doesn't make it the one .../releases/latest/download/ hands out.
          flags=(--latest="$LATEST")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # --verify-tag: publish on the tag Gitea sent, and never create one
          gh release create "$TAG" dist/* --verify-tag --title "$TITLE" --notes-file notes.md "${flags[@]}"
