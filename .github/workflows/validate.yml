# The Marketplace's own checks (the HACS action): the catalog requires a passing run with nothing ignored.
# See https://contributors.home-assistant.io/marketplace/reference/validation/
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# No access at all: the action only reads the public repository. Third-party code runs here, so it's pinned to a
# reviewed commit (the comment says which branch that commit was on) rather than following a branch that could change.
permissions: {}

# No telemetry from any tool a step runs: GH_TELEMETRY for the GitHub CLI (on by default),
# DO_NOT_TRACK for any other tool that honours it. tests/test_release.py checks every workflow sets both.
env:
  GH_TELEMETRY: "false"
  DO_NOT_TRACK: "1"

jobs:
  validate-hacs:
    name: Marketplace checks (HACS action)
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration
