# Checks every push and pull request, weekly (to catch Home Assistant changes), and on demand.
# Everything here except hassfest can also be run locally; see CONTRIBUTING.md.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Read-only: nothing here publishes. Checkouts don't keep the token either (persist-credentials: false), so the
# tools these jobs install can't use it.
permissions:
  contents: read

# No telemetry from any tool a step runs: GH_TELEMETRY for the GitHub CLI (on by default),
# DO_NOT_TRACK for any other tool that honours it. tests/test_release.py checks every workflow sets both.
env:
  GH_TELEMETRY: "false"
  DO_NOT_TRACK: "1"

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check
      - run: ruff format --check

  hassfest:
    name: Home Assistant's integration checks (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Third-party code, so pinned to a reviewed commit (the comment says which branch it was on) rather than
      # following a branch that could change. Update it by hand now and then: hassfest's checks follow Home Assistant.
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master, 2026-11-23

  tests:
    name: Tests (nine-day simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Home Assistant 2026.11 runs on Python 3.14 and supports nothing older, so that's what the tests run on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tests/test_integration.py
      - run: python tests/test_bad_data.py
      - run: python tests/test_release.py
      - name: Build nationalgrid.zip, and check it installs
        run: python scripts/build_package.py
